<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mermaid</title>
<style>
  /* --bg/--fg/--dot/--red are replaced by the Omarchy theme in applyTheme(). */
  :root { --bg: #1e1e1e; --fg: #ddd; --dot: #ffffff14; --red: #f38ba8; }
  html, body { margin: 0; height: 100%; overflow: hidden; background-color: var(--bg); color: var(--fg);
               font: 14px system-ui, sans-serif; user-select: none; }
  /* Faint dot grid; apply() moves it with the diagram when panning. */
  body { background-image: radial-gradient(var(--dot) 1px, transparent 1.5px); background-size: 24px 24px; }
  html.export body { background-image: none; }
  #stage { position: absolute; left: 0; top: 0; cursor: grab; }
  #stage svg { display: block; max-width: none !important; }
  /* Mermaid wraps subgraph titles at a fixed 200px (they ignore
     wrappingWidth) but leaves room for only one line, so the rest hides
     behind the first node. Lifting the cap while Mermaid measures keeps the
     title on one line and widens the subgraph to fit. */
  .cluster-label foreignObject > div { max-width: none !important; }
  html.dragging #stage { cursor: grabbing; }
  /* Top-left label: same text as the mermaid-pick menu row. */
  #info { position: fixed; top: 12px; left: 16px; z-index: 1; pointer-events: none;
          padding: 6px 10px; border-radius: 6px; font: 13px var(--font, monospace);
          background: color-mix(in srgb, var(--bg) 85%, transparent); }
  #info:empty { display: none; }
  #info .detail { opacity: var(--detail, 0.6); font-size: 11px; margin-top: 2px; }
  html.export #info { display: none; }
  #err { display: none; padding: 72px 24px 24px;  /* top clears the info label */ height: 100%; box-sizing: border-box; overflow: auto; user-select: text; }
  #err h2 { color: var(--red); margin-top: 0; }
  #err pre { white-space: pre-wrap; font: 13px monospace; }
  #err pre.src { opacity: 0.6; border-top: 1px solid var(--dot); padding-top: 12px; }
  /* PNG export: let the page grow to the diagram's size so a full-document
     snapshot captures all of it, pinned at the top-left corner. */
  html.export, html.export body { height: auto; overflow: visible; }
  html.export #stage { position: static; display: inline-block; padding: 24px; }
</style>
<script src="vendor/mermaid.min.js"></script>
</head>
<body>
<div id="info"></div>
<div id="stage"></div>
<div id="err"></div>
<script>
  const stage = document.getElementById('stage');
  const err = document.getElementById('err');
  const info = document.getElementById('info');
  const post = (msg) => window.webkit.messageHandlers.mv.postMessage(JSON.stringify(msg));

  let svg = null, natW = 0, natH = 0;   // diagram's natural size, in CSS px
  let scale = 1, tx = 0, ty = 0;        // current zoom and pan offset
  let moved = false;                    // has the user zoomed/panned yet?

  let accents = [];                     // subgraph border colours, in turn

  // Colours as [r, g, b] from #rrggbb; contrast as in the WCAG guidelines,
  // from 1 (identical) to 21 (black on white).
  const rgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  function luminance(hex) {
    const [r, g, b] = rgb(hex).map((v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function contrast(a, b) {
    const [x, y] = [luminance(a), luminance(b)].sort((m, n) => n - m);
    return (x + 0.05) / (y + 0.05);
  }
  // The colour darkened just enough to reach a contrast against bg.
  function darkenFor(hex, bg, target) {
    const [r, g, b] = rgb(hex);
    for (let k = 1; k > 0; k -= 0.02) {
      const v = [r, g, b].map((n) => Math.round(n * k).toString(16).padStart(2, '0')).join('');
      if (contrast('#' + v, bg) >= target) return '#' + v;
    }
    return '#000000';
  }
  const clearerOn = (fill, a, b) => (contrast(a, fill) >= contrast(b, fill) ? a : b);

  // Map an Omarchy theme (colors.toml + font) onto Mermaid's 'base' theme,
  // which is the one that accepts a custom palette. No theme = plain dark.
  function applyTheme(theme) {
    const config = { startOnLoad: false, securityLevel: 'strict', theme: 'dark' };
    const c = theme && theme.colors;
    if (c && c.background && c.foreground) {
      // Light and dark themes use the same names the other way round: in a
      // light theme dark_foreground is a pale grey and lighter_background can
      // be a heavy grey, so pick each role's colour by mode. Thin dark text on
      // a light page reads as fainter than its colour suggests, so light
      // themes also get darker text and lines, and a heavier font.
      const light = c.mode === 'light';
      const bg = c.background;
      const fg = light ? darkenFor(c.foreground, bg, 10) : c.foreground;
      const strong = light ? fg : (c.light_foreground || fg);
      const boxFill = light ? bg : (c.dark_background || bg);
      const groupFill = light ? (c.dark_background || bg) : (c.lighter_background || bg);
      const lines = light ? fg : (c.dark_foreground || fg);
      const font = theme.font ? `"${theme.font}", monospace` : 'sans-serif';
      // Brightest first: the theme's main accent is often close to its
      // background colours, so it would barely show on a subgraph border.
      accents = [c.cyan, c.magenta, c.orange, c.bright_yellow, c.accent, c.red, c.bright_blue]
        .filter((v, i, all) => v && all.indexOf(v) === i);
      const scale = {};
      accents.forEach((v, i) => {
        scale['cScale' + i] = v;
        scale['cScaleLabel' + i] = clearerOn(v, fg, bg);
        scale['pie' + (i + 1)] = v;
      });
      Object.assign(config, {
        theme: 'base',
        fontFamily: font,
        themeCSS: (light ? 'text, tspan, .nodeLabel, .edgeLabel, .label, span { font-weight: 500; }' : '')
          // cScaleLabel only reaches SVG text, not the HTML labels in mind maps.
          + accents.map((v, i) => `.section-${i} span, .section-${i} .nodeLabel { color: ${clearerOn(v, fg, bg)}; }`).join('')
          // The centre node gets its colours separately, from Mermaid's git palette.
          + `.section-root circle, .section-root rect, .section-root path, .section-root polygon { fill: ${boxFill}; stroke: ${lines}; stroke-width: 2px; }`
          + `.section-root span, .section-root .nodeLabel { color: ${fg}; }`,
        gantt: { fontSize: 14, sectionFontSize: 14, barHeight: 28, barGap: 6, leftPadding: 110 },
        themeVariables: {
          darkMode: !light,
          fontFamily: font,
          background: bg,
          mainBkg: boxFill,
          primaryColor: boxFill,
          primaryTextColor: fg,
          primaryBorderColor: lines,
          secondaryColor: c.lighter_background || bg,
          tertiaryColor: c.selection || bg,
          nodeBorder: strong,
          nodeTextColor: fg,
          textColor: fg,
          titleColor: c.bright_foreground || fg,
          lineColor: lines,
          clusterBkg: groupFill,
          clusterBorder: c.accent || fg,
          edgeLabelBackground: light ? bg : (c.darker_background || bg),
          noteBkgColor: groupFill,
          noteTextColor: fg,
          noteBorderColor: c.accent || fg,
          actorBkg: boxFill,
          actorBorder: c.accent || fg,
          actorTextColor: fg,
          signalColor: fg,
          signalTextColor: fg,
          // Setting xyChart replaces all of Mermaid's chart colours, not
          // just the palette, so every one is given here.
          xyChart: {
            backgroundColor: bg, titleColor: fg, plotColorPalette: accents.join(','),
            xAxisLabelColor: fg, xAxisTitleColor: fg, xAxisTickColor: fg, xAxisLineColor: fg,
            yAxisLabelColor: fg, yAxisTitleColor: fg, yAxisTickColor: fg, yAxisLineColor: fg,
          },
          ...scale,
        },
      });
      const root = document.documentElement.style;
      root.setProperty('--bg', bg);
      root.setProperty('--fg', fg);
      root.setProperty('--font', font);
      root.setProperty('--dot', (c.muted || fg) + '55');
      root.setProperty('--detail', light ? '0.8' : '0.6');
      if (c.red) root.setProperty('--red', c.red);
    }
    mermaid.initialize(config);
  }

  // Give each subgraph its own accent border, like Mermaid's live editor.
  // Set inline so a saved SVG keeps the colours.
  function colourSubgraphs() {
    if (!accents.length) return;
    // Mermaid lists subgraphs bottom-up, so hand out colours by position.
    const top = (el) => el.getBoundingClientRect();
    [...svg.querySelectorAll('g.cluster > rect')]
      .sort((a, b) => top(a).top - top(b).top || top(a).left - top(b).left)
      .forEach((rect, i) => {
      rect.style.stroke = accents[i % accents.length];
      rect.style.strokeWidth = '1.5px';
    });
  }

  // Zoom by resizing the SVG itself rather than a CSS transform, so the
  // browser redraws the vector shapes and text stays sharp at any size.
  function apply() {
    svg.style.width = natW * scale + 'px';
    svg.style.height = natH * scale + 'px';
    stage.style.left = tx + 'px';
    stage.style.top = ty + 'px';
    document.body.style.backgroundPosition = `${tx}px ${ty}px`;
  }

  function fit() {
    const pad = 32, W = innerWidth, H = innerHeight;
    scale = Math.min((W - 2 * pad) / natW, (H - 2 * pad) / natH, 2);
    tx = (W - natW * scale) / 2;
    ty = (H - natH * scale) / 2;
    moved = false;
    apply();
  }

  function actualSize() {
    zoomAt(1 / scale, innerWidth / 2, innerHeight / 2);
  }

  // Zoom around a point (cx, cy) so whatever is under it stays put.
  function zoomAt(factor, cx, cy) {
    const next = Math.min(40, Math.max(0.05, scale * factor));
    factor = next / scale;
    tx = cx - (cx - tx) * factor;
    ty = cy - (cy - ty) * factor;
    scale = next;
    moved = true;
    apply();
  }

  function showError(e, src) {
    // A failed render can leave Mermaid's scratch element in the body.
    for (const el of [...document.body.children])
      if (el !== stage && el !== err && el !== info && el.tagName !== 'SCRIPT') el.remove();
    err.style.display = 'block';
    const h = document.createElement('h2');
    h.textContent = "Mermaid couldn't draw this";
    const msg = document.createElement('pre');
    msg.textContent = String((e && e.message) || e);
    const code = document.createElement('pre');
    code.className = 'src';
    code.textContent = src;
    err.replaceChildren(h, msg, code);
  }

  function showInfo(about, title) {
    if (!about) return info.replaceChildren();
    const label = document.createElement('div');
    label.textContent = [about.when, title].filter(Boolean).join('  ');
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.textContent = [about.detail, about.pos].filter(Boolean).join('  ·  ');
    info.replaceChildren(label, ...(detail.textContent ? [detail] : []));
  }

  function dedent(text) {
    const lines = text.split('\n');
    const indents = lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length);
    const cut = Math.min(...indents, Infinity);
    return lines.map(l => l.slice(cut)).join('\n');
  }

  // The first candidate that Mermaid accepts, whole or cut short at a blank
  // line (prose after a diagram follows a blank line). Cutting anywhere else
  // could turn a broken diagram into a smaller one that parses, hiding the
  // error. Null if none parse; .dropped counts the lines left off.
  async function firstThatParses(candidates) {
    for (const c of candidates) {
      const lines = c.src.split('\n');
      for (let n = lines.length; n > 0; n--) {
        if (n < lines.length && lines[n].trim()) continue;
        const src = dedent(lines.slice(0, n).join('\n')).trim();
        try {
          await mermaid.parse(src);
          const dropped = lines.slice(n).filter(l => l.trim()).length;
          return { ...c, src, dropped };
        } catch (e) { /* try the next blank line up */ }
      }
    }
    return null;
  }

  // Called from Python once the page has loaded, with the possible sources
  // ({src, label}) best first. Also called again when stepping to another
  // diagram with the arrow keys.
  async function showDiagram(candidates, theme, about) {
    applyTheme(theme);
    const chosen = (await firstThatParses(candidates)) || candidates[0];
    const src = chosen.src;
    const skipped = chosen.dropped
      ? `${chosen.dropped} line${chosen.dropped > 1 ? 's' : ''} after the diagram ignored` : '';
    showInfo({ ...about, pos: [about.pos, skipped].filter(Boolean).join('  ·  ') }, chosen.label);
    post({ cmd: 'shown', label: chosen.label });
    svg = null;
    stage.replaceChildren();
    err.style.display = 'none';
    try {
      const { svg: markup } = await mermaid.render('mv' + Date.now(), src);
      stage.innerHTML = markup;
      svg = stage.querySelector('svg');
      const vb = svg.viewBox.baseVal;
      if (vb && vb.width) { natW = vb.width; natH = vb.height; }
      else { const r = svg.getBoundingClientRect(); natW = r.width; natH = r.height; }
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      // Same fix inline, so a saved SVG matches without the page's CSS.
      for (const div of svg.querySelectorAll('.cluster-label foreignObject > div'))
        div.style.maxWidth = 'none';
      colourSubgraphs();
      fit();
    } catch (e) {
      showError(e, src);
    }
  }

  // --- Saving -------------------------------------------------------------

  // The text in foreignObject labels, line by line as laid out on screen.
  function labelLines(label) {
    const lines = [];
    const range = document.createRange();
    const measure = (node, start, end) => {
      range.setStart(node, start);
      range.setEnd(node, end);
      return range.getBoundingClientRect();
    };
    const addToLine = (node, start, end) => {
      const r = measure(node, start, end);
      const middle = (r.top + r.bottom) / 2;
      let line = lines.find((l) => Math.abs(l.middle - middle) < r.height / 2);
      if (!line) lines.push(line = { middle, left: r.left, right: r.right, words: [], el: node.parentElement });
      line.words.push(node.data.slice(start, end));
      line.left = Math.min(line.left, r.left);
      line.right = Math.max(line.right, r.right);
    };
    const walker = document.createTreeWalker(label, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const node = walker.currentNode;
      for (const word of node.data.matchAll(/\S+/g)) {
        // A long word can wrap too, at a hyphen or slash, so start a new piece
        // wherever a character lands on a different line from the last one.
        let start = word.index, at = word.index, lastMiddle = null;
        for (const char of word[0]) {
          const r = measure(node, at, at + char.length);
          if (r.width) {
            const middle = (r.top + r.bottom) / 2;
            if (lastMiddle !== null && Math.abs(middle - lastMiddle) >= r.height / 2) {
              addToLine(node, start, at);
              start = at;
            }
            lastMiddle = middle;
          }
          at += char.length;
        }
        addToLine(node, start, at);
      }
    }
    return lines;
  }

  // SVG shapes and text to stand in for one foreignObject label, in the same
  // place. Only browsers draw the HTML inside foreignObject, so without this
  // a saved SVG opens in other apps with its labels missing.
  function plainLabel(label) {
    const make = (tag) => document.createElementNS('http://www.w3.org/2000/svg', tag);
    const box = label.getBoundingClientRect();
    const lines = labelLines(label);
    if (!box.width || !lines.length) return [];
    const unit = label.width.baseVal.value / box.width;  // user units per screen px
    const x0 = label.x.baseVal.value, y0 = label.y.baseVal.value;
    const parts = [];
    const painted = [...label.querySelectorAll('*')].find((el) => {
      const b = getComputedStyle(el).backgroundColor;
      return b && b !== 'transparent' && !/, 0\)$/.test(b);
    });
    if (painted) {
      const rect = make('rect');
      rect.setAttribute('x', x0);
      rect.setAttribute('y', y0);
      rect.setAttribute('width', label.width.baseVal.value);
      rect.setAttribute('height', label.height.baseVal.value);
      rect.setAttribute('fill', getComputedStyle(painted).backgroundColor);
      parts.push(rect);
    }
    for (const line of lines) {
      const css = getComputedStyle(line.el);
      const centred = css.textAlign === 'center';
      const text = make('text');
      const across = centred ? (line.left + line.right) / 2 : line.left;
      text.setAttribute('x', x0 + (across - box.left) * unit);
      text.setAttribute('y', y0 + (line.middle - box.top) * unit);
      text.setAttribute('dy', '0.35em');
      text.setAttribute('style', [
        `fill: ${css.color}`, `font-family: ${css.fontFamily}`, `font-size: ${css.fontSize}`,
        `font-weight: ${css.fontWeight}`, `font-style: ${css.fontStyle}`,
        `text-anchor: ${centred ? 'middle' : 'start'}`,
      ].join('; '));
      text.textContent = line.words.join(' ');
      parts.push(text);
    }
    return parts;
  }

  function svgForSaving() {
    const copy = svg.cloneNode(true);
    const labels = svg.querySelectorAll('foreignObject');
    copy.querySelectorAll('foreignObject').forEach((label, i) => {
      // Some labels sit in a <switch> with a fallback. A switch draws only its
      // first child, so the plain text has to replace the whole switch.
      const inSwitch = label.parentNode.localName === 'switch';
      (inSwitch ? label.parentNode : label).replaceWith(...plainLabel(labels[i]));
    });
    copy.setAttribute('width', natW);
    copy.setAttribute('height', natH);
    copy.removeAttribute('style');
    // The dark theme draws light text, so keep the dark background with it.
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    copy.setAttribute('style', `background-color: ${bg}`);
    // Other apps ignore that style, so draw the background as a shape too.
    const backdrop = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    const vb = svg.viewBox.baseVal;
    for (const [name, value] of [['x', vb.x], ['y', vb.y], ['width', vb.width], ['height', vb.height]])
      backdrop.setAttribute(name, value);
    backdrop.setAttribute('style', `fill: ${bg}; stroke: none`);
    copy.prepend(backdrop);
    return new XMLSerializer().serializeToString(copy);
  }

  function saveSvg() {
    post({ cmd: 'svg', data: svgForSaving() });
  }

  let saved = null;
  function enterExport() {
    saved = { scale, tx, ty };
    // 2x for a crisp PNG, but keep under ~8000px so the snapshot stays sane.
    scale = Math.min(2, 8000 / Math.max(natW, natH));
    document.documentElement.classList.add('export');
    svg.style.width = natW * scale + 'px';
    svg.style.height = natH * scale + 'px';
    // Wait two frames so the new layout is painted before Python snapshots it.
    requestAnimationFrame(() => requestAnimationFrame(() => post({
      cmd: 'png',
      w: stage.offsetWidth, h: stage.offsetHeight,
      docW: document.documentElement.scrollWidth,
    })));
  }

  function exitExport() {
    document.documentElement.classList.remove('export');
    ({ scale, tx, ty } = saved);
    apply();
  }

  // --- Input --------------------------------------------------------------

  addEventListener('wheel', (e) => {
    if (!svg) return;
    e.preventDefault();
    zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
  }, { passive: false });

  let drag = null;
  addEventListener('mousedown', (e) => {
    if (!svg || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY };
    document.documentElement.classList.add('dragging');
  });
  addEventListener('mousemove', (e) => {
    if (!drag) return;
    tx += e.clientX - drag.x;
    ty += e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    moved = true;
    apply();
  });
  addEventListener('mouseup', () => {
    drag = null;
    document.documentElement.classList.remove('dragging');
  });

  addEventListener('resize', () => { if (svg && !moved) fit(); });

  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const k = e.key.toLowerCase();
    if (k === 'escape' || k === 'q') return post({ cmd: 'close' });
    // Previous/next diagram in the folder (Python ignores this for the clipboard).
    if (k === 'arrowleft') return post({ cmd: 'step', dir: -1 });
    if (k === 'arrowright') return post({ cmd: 'step', dir: 1 });
    if (!svg) return;
    const cx = innerWidth / 2, cy = innerHeight / 2;
    if (k === '+' || k === '=') zoomAt(1.25, cx, cy);
    else if (k === '-') zoomAt(0.8, cx, cy);
    else if (k === '0') fit();
    else if (k === '1') actualSize();
    else if (k === 's') saveSvg();
    else if (k === 'p') enterExport();
  });
</script>
</body>
</html>
